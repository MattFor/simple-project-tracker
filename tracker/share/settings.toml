[display]
# Lay each row out yourself instead of using columns and the separators below.
# Empty means use columns.
#
# $tid $id $name $path $status $last_touched $version $language $note
#
# Fields are padded so everything stays aligned. Write $> to align a field to
# the right, ${name} when text follows it immediately.
#
# format = "$>tid. $name [$status] $last_touched"
# format = "${tid}) $name - $note"
format = ""

# Maximum number of projects shown at once, 0 means no limit.
list_limit = 20

show_notes = true
show_headers = true

# Where a project's note goes.
# auto   = same line when it fits, its own line when it does not
# inline = always the same line, shortened when needed
# below  = always on its own line
note_position = "auto"

# A note needs at least this much free space to stay on the same line.
note_min_width = 24

# Format used for project timestamps.
time_format = "%Y-%m-%d %H:%M:%S"

# Show "2 days ago" instead of the timestamp.
relative_times = false

# How a relative time is written.
# long  = 8 seconds ago, 3 minutes ago, 1 day ago, just now
# short = 8s ago, 3m ago, 1d ago, now
relative_style = "long"

# id / tid / name / path / status / last_touched / last_used / version / language
columns = ["tid", "id", "name", "status", "last_touched"]

# Widest a project name may print, 0 keeps every name whole.
name_max_width = 0

# How a name too long for name_max_width is shortened.
# full       = never shortened, the column simply grows
# truncate   = cut on a -, _ or CamelCase boundary, von-neumann-machine-simulator
#              becomes von-neumann...
# abbreviate = shorten every word instead, von-neumann-machine-simulator becomes
#              von-neum-mac-sim and VonNeumannMachineSimulator becomes VonNeuMacSim
name_style = "truncate"

# What a truncated name ends with.
name_continuator = "..."

vertical_separator = " | "
horizontal_separator = "-"

# Widest line to print, 0 follows the terminal.
max_width = 0

# Applies to every listing. (except `all`)
#
# +m:value  = include partial name/path matches
# -m:value  = exclude partial name/path matches
# +r:regex  = include regex name matches
# -r:regex  = exclude regex name matches
# +s:status = include a status, comma separated for several
# -s:status = exclude a status, comma separated for several
#
# filter = ["-s:archived"]        hide archived projects everywhere
# filter = ["+s:current,dev"]    show only what is being worked on
filter = []

# Colour per status. (You can add some here)
# red / green / yellow / blue / magenta / cyan / gray
#
# A note may colour itself the same way: "{red}broken{/} since friday".
# Shorthands: {r} {g} {y} {u} {m} {c} {w} {k} {b}old {d}im and {/} to go back.
[display.status_colours]
current = "green"
active = "green"
todo = "yellow"
planned = "yellow"
review-needed = "magenta"
blocked = "red"
shelf = "blue"
paused = "blue"
done = "cyan"
completed = "cyan"
final = "cyan"
maintenance = "cyan"
archived = "gray"
deleted = "gray"
unknown = "gray"


[sorting]
# id / name / path / status / last_touched / last_used
#
# last_touched = when the files changed on disk
# last_used    = when tracker last touched this
by = "last_touched"

# ascending / descending
direction = "descending"

# The order `by = "status"` uses. Statuses left out of it sort after the rest.
# Empty sorts them alphabetically.
#
# status_order = ["current", "planned", "blocked", "shelf", "archived"]
status_order = []


[projects]
default_status = "unknown"

# Directories that are never scanned and never count as "your own work".
ignore = [
    ".git",
    ".venv",
    "venv",
    "dist",
    "build",
    "target",
    "__pycache__",
    "node_modules",
    ".idea",
    ".vscode",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache"
]

# Generated files that do not count as "your own work" either.
ignore_files = [
    "*.pkl",
    "*.pyc",
    "*.pyo",
    "*.log",
    "*.lock",
    "*.pid",
    "*.tmp",
    "*.swp",
    "*.bak",
    "*.orig",
    "*.db",
    "*.sqlite",
    "*.sqlite3",
    ".DS_Store"
]

# Give a project its status from how long ago it was last touched.
auto_status = false

# How ambiguous partial matches are resolved.
#
# starts_with = prefer a project whose name starts with the selector
# first_match = use the first matching project
# frecency    = the one you reach for most through tracker, ranked the way
#               zoxide ranks directories: how often, weighted by how recently
# zoxide      = the one you visit most, read straight from the zoxide database,
#               falling back to frecency when zoxide knows none of them
#
# frecency and zoxide report the clash as usual when they cannot tell.
conflict_resolution_preference = "starts_with"

# What a bare number means when it is both an ID and a TID.
#
# ask = report the clash and let you pick with i: or t:
# id  = always the permanent ID
# tid = always the temporary ID from the current view
number_preference = "ask"

# Remember when a project was last looked at with tracker, for sorting.by =
# "last_used". check, path, edit and a bare project lookup all count.
track_usage = true

# Ask before removing several projects at once.
confirm_destructive = true

# status = at most this many days since the project was last touched.
# The one with 0 catches everything older.
[projects.auto_status_rules]
dev = 7
stable = 90
archive = 0


[scan]
# Detect projects by the presence of .git
detect_git = true

# Search recursively below the supplied path
recursive = true

# Do not scan inside an already detected Git project
stop_at_project = true

# Follow symlinked directories while scanning
follow_symlinks = false

# Skip the ignored directories and files when working out the last touched date.
# Keeps .git, node_modules and friends from counting as your own edits.
timestamps_skip_ignored = true

# Recognize a project that was moved instead of reporting it as deleted and
# adding the new path as a second entry.
detect_moves = true

# The most, as a percentage of the projects under a scanned path, that a single
# scan is allowed to mark deleted. Above it the scan is treated as broken.
# 100 removes the brake. Fewer than 3 projects at once is never blocked.
vanish_limit = 50

# Projects excluded from being indexed.
exclude = []


[output]
colour = true
compact = false
absolute_paths = true


[database]
# Relative paths are resolved against the project directory.
# TRACKER_DATA overrides this.
file = "data.pkl"


[logging]
always_verbose = false


[daemon]
# Directories to monitor
paths = [
    "~/Programming" # For example
]

# Whether to still keep deleted projects
archive = true

# Scan interval in seconds
interval = 60

# Format used by daemon logs
timestamp_format = "%Y-%m-%d %H:%M:%S"
