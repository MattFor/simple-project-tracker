name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip

      - name: Install tooling
        run: python -m pip install ruff==0.16.5 basedpyright==1.40.2 pytest -e .

      - name: Ruff
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Basedpyright
        run: basedpyright

      - name: Prettier
        run: npx --yes prettier@3.9.6 --check .

  test:
    name: Tests (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-14
            python-version: '3.14'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install pytest -e .

      - name: Tests
        run: python -m pytest

      - name: Tests without pytest
        run: python tests/run.py

      - name: Smoke test the installed command
        run: |
          tracker version
          tracker help > /dev/null
          tracker help selection > /dev/null
          tracker stats

  package:
    name: Build the distribution
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip

      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Check the man page
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mandoc
          mandoc -T lint -W warning man/tracker.1

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
