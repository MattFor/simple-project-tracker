[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracker"
version = "1.0.0"
description = "Simple project tracker"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["cli", "projects", "git", "tracker"]

authors = [
    { name = "MattFor", email = "mattfor@relaxy.xyz" }
]

license = "MIT"
license-files = ["LICENSE"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Utilities",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/MattFor/tracker"
Source = "https://github.com/MattFor/tracker"
Mirror = "https://codeberg.org/MattFor/tracker"
Issues = "https://github.com/MattFor/tracker/issues"

[project.scripts]
tracker = "tracker.cli.app:main"
t = "tracker.cli.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tracker*"]

[tool.setuptools.package-data]
tracker = ["share/*.toml", "share/*.txt", "share/completion.*"]

[dependency-groups]
dev = [
    "ruff",
    "basedpyright",
    "pytest>=9.0.2"
]

[tool.ruff]
line-length = 90
indent-width = 4

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.pycodestyle]
max-line-length = 90

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
include = ["tracker", "tests", "main.py"]

reportPrivateUsage = false # We'll deal with this later methinks
reportImportCycles = false

reportAny = false
reportExplicitAny = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
