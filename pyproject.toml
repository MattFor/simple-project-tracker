[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-project-tracker"
version = "1.0.0"
description = "Simple project tracker"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["cli", "projects", "git", "tracker"]

authors = [
    { name = "MattFor", email = "mattfor@relaxy.xyz" }
]

license = "MIT"
license-files = ["LICENSE"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development",
    "Topic :: Utilities",
    "Typing :: Typed",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/MattFor/simple-project-tracker"
Source = "https://github.com/MattFor/simple-project-tracker"
Mirror = "https://codeberg.org/MattFor/simple-project-tracker"
Issues = "https://github.com/MattFor/simple-project-tracker/issues"
Changelog = "https://github.com/MattFor/simple-project-tracker/blob/master/CHANGELOG.md"

[project.scripts]
tracker = "tracker.cli.app:main"
t = "tracker.cli.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tracker*"]

[tool.setuptools.package-data]
tracker = ["py.typed", "share/*.toml", "share/*.txt", "share/completion.*"]

[dependency-groups]
dev = [
    "ruff",
    "basedpyright",
    "pytest>=9.0.2"
]

[tool.ruff]
line-length = 90
indent-width = 4

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", # pycodestyle: real mistakes, not whitespace taste
    "F", # pyflakes
    "B", # bugbear
    "C4", # comprehensions
    "PIE", # misc lint
    "SIM", # simplify
    "UP", # pyupgrade
    "ARG", # unused arguments
    "PLE", "PLW", # pylint errors and warnings
    "FURB", # modernisation
    "RUF", # ruff specific
]

[tool.ruff.lint.pycodestyle]
max-line-length = 90

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
xfail_strict = true

[tool.basedpyright]
include = ["tracker", "tests", "main.py"]
exclude = ["**/__pycache__", ".venv", "build", "dist"]

pythonVersion = "3.12"

reportAny = false
reportExplicitAny = false
reportPrivateUsage = false
reportImportCycles = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
